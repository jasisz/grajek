name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Run portable host tests
        run: make -C host test

  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - cardputer-adv
          - cardputer-adv-pl
          - cardputer-body-probe
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19
      - name: Build ${{ matrix.environment }}
        run: pio run -e "${{ matrix.environment }}"
      - name: Keep production image for package smoke test
        if: matrix.environment != 'cardputer-body-probe'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-${{ matrix.environment }}
          path: .pio/build/${{ matrix.environment }}/firmware.factory.bin
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  package-smoke:
    needs: firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: build-cardputer-adv
          path: build/en
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: build-cardputer-adv-pl
          path: build/pl
      - name: Package a synthetic release
        run: >-
          python tools/package_release.py
          --version v0.0.0-ci
          --en-build build/en
          --pl-build build/pl
          --web-source web
          --output dist
      - name: Verify packaged checksums
        working-directory: dist/release
        run: sha256sum -c SHA256SUMS
