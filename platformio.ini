; grajek — an instrument on the M5Stack Cardputer-ADV (StampS3A / ESP32-S3FN8,
; 8MB flash, no PSRAM)
;
; Platform: pioarduino (Arduino core 3.x / ESP-IDF 5.x) — provides the new I2S
; API (driver/i2s_std.h), the same one the official ADV factory firmware uses.
; The m5stack-stamps3 board matches the Stamp-S3A module exactly (8MB, qio,
; no PSRAM). M5Unified >= 0.2.8 and M5GFX >= 0.2.10 are the first releases
; with Cardputer-ADV support; the official demo pins 0.2.10 / 0.2.15. The
; M5Cardputer library supports the ADV keyboard (TCA8418 over I2C) since
; 1.1.0 — pulled from GitHub because the PlatformIO registry lags behind.

[env:cardputer-adv]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
board_build.partitions = default_8MB.csv
build_flags =
    -O2
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3
lib_deps =
    M5Cardputer=https://github.com/m5stack/M5Cardputer
    m5stack/M5Unified@^0.2.10
    m5stack/M5GFX@^0.2.15
; M5Cardputer's manifest pulls in IRremote which its src never uses — skip it
lib_ignore = IRremote
