; grajek — an instrument on the M5Stack Cardputer-ADV (StampS3A / ESP32-S3FN8,
; 8MB flash, no PSRAM)
;
; Platform: pioarduino 55.03.311 (Arduino 3.3.11 / ESP-IDF 5.5.5). Keep the
; release pinned so firmware builds do not drift with the moving stable tag.
; The m5stack-stamps3 board matches the Stamp-S3A module exactly (8MB, qio,
; no PSRAM). M5Unified >= 0.2.8 and M5GFX >= 0.2.10 are the first releases
; with Cardputer-ADV support; the official demo pins 0.2.10 / 0.2.15. The
; M5Cardputer library supports the ADV keyboard (TCA8418 over I2C) since
; 1.1.0 — pulled from GitHub because the PlatformIO registry lags behind.

[platformio]
default_envs = cardputer-adv

[env:cardputer-adv-pl]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
board_build.partitions = default_8MB.csv
build_src_filter =
    +<*>
    -<body_probe_main.cpp>
build_flags =
    -O2
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3
lib_deps =
    M5Cardputer=https://github.com/m5stack/M5Cardputer#f1392858b9994c3547120e602a57d3553d16ab01
    m5stack/M5Unified@0.2.19
    m5stack/M5GFX@0.2.26
; M5Cardputer's manifest pulls in IRremote which its src never uses — skip it
lib_ignore = IRremote

; English is the public/default image. Language remains a build choice: both
; images keep the exact same settings/NVS format and have no runtime locale.
[env:cardputer-adv]
extends = env:cardputer-adv-pl
build_flags =
    ${env:cardputer-adv-pl.build_flags}
    -DGRAJEK_LANG_EN=1

; Isolated research image for the "borrowed body" experiment. It excites the
; Cardputer-ADV chassis with the built-in speaker and streams raw BMI270 FIFO
; samples over USB. This deliberately replaces, rather than links with, the
; production firmware so the two I2S implementations can never run together.
[env:cardputer-body-probe]
extends = env:cardputer-adv-pl
build_src_filter =
    -<*>
    +<body_probe_main.cpp>
